<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chakaezba Space</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --glass: rgba(255, 255, 255, 0.1); --blur: blur(25px); --accent: #ffffff; }
        body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); display: flex; align-items: center; justify-content: center; color: white; overflow: hidden; }
        
        .main-layout { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 20px; 
            height: 620px; 
            width: 95%; 
            max-width: 1200px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel { 
            background: var(--glass); 
            backdrop-filter: var(--blur); 
            -webkit-backdrop-filter: var(--blur); 
            border: 1px solid rgba(255,255,255,0.15); 
            border-radius: 32px; 
            padding: 40px 25px 25px 25px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.4); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box; 
            position: relative;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .panel-label { position: absolute; top: 15px; left: 20px; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.4; font-weight: 600; pointer-events: none; }

        #player-card { 
            width: 380px; 
            height: 100%; 
            opacity: 0; 
            visibility: hidden;
            transform: translateX(50px) scale(0.9);
            margin-right: -400px; 
            pointer-events: none;
        }

        #player-card.visible { 
            opacity: 1; 
            visibility: visible;
            transform: translateX(0) scale(1); 
            margin-right: 0;
            pointer-events: auto;
        }

        #profile-card { width: 280px; height: 100%; justify-content: center; z-index: 2; }
        #track-card { width: 130px; height: 100%; overflow-y: auto; z-index: 2; }

        .avatar-container { width: 160px; height: 160px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); overflow: hidden; margin-bottom: 20px; position: relative; flex-shrink: 0; cursor: pointer; }
        .profile-avatar { width: 100%; height: 100%; object-fit: cover; }
        
        .social-icons { display: flex; gap: 15px; margin-top: 30px; }
        .social-icons a { color: white; font-size: 22px; opacity: 0.6; transition: 0.3s; text-decoration: none; }
        .social-icons a:hover { opacity: 1; transform: translateY(-3px); }

        .main-cover { width: 100%; aspect-ratio: 1/1; border-radius: 20px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .info { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 15px; text-align: center; }
        .info h2 { margin: 0; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .info p { margin: 5px 0 0 0; font-size: 14px; color: rgba(255,255,255,0.5); font-weight: 400; }
        
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; margin-bottom: 25px; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; border-radius: 10px; }
        
        .controls-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 20px; }
        .player-btns { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .nav-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .nav-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        .skip-btn { background: none; border: none; color: white; opacity: 0.4; cursor: pointer; transition: 0.3s; font-size: 16px; padding: 10px; }
        .skip-btn:hover { opacity: 1; transform: scale(1.2); }
        .play-btn { width: 60px; height: 60px; background: white; color: black; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        .volume-slider { -webkit-appearance: none; width: 100px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 5px; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: white; border-radius: 50%; cursor: pointer; }

        .track-mini-item { width: 80px; height: 80px; margin-bottom: 15px; cursor: pointer; transition: 0.4s ease; flex-shrink: 0; }
        .track-mini-item img { width: 100%; height: 100%; border-radius: 20px; object-fit: cover; opacity: 0.4; border: 2px solid transparent; transition: 0.3s; }
        .track-mini-item.active img { opacity: 1; border-color: white; transform: scale(1.1); }

        ::-webkit-scrollbar { width: 0px; }

        @media (max-width: 900px) {
            body { overflow-y: auto; align-items: flex-start; padding: 20px 0; }
            .main-layout { flex-direction: column; height: auto; gap: 15px; }
            #player-card { width: 90%; margin-right: 0; height: auto; order: 2; }
            #profile-card { width: 90%; height: auto; order: 1; padding: 50px 25px; }
            #track-card { width: 90%; height: auto; order: 3; overflow-y: visible; }
            #list { display: flex; overflow-x: auto; width: 100%; gap: 15px; padding: 10px 0; }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="glass-panel" id="player-card">
            <div class="panel-label">Music Player</div>
            <img id="cover" src="" class="main-cover">
            <div class="info">
                <h2 id="title">Loading...</h2>
                <p id="artist">Artist</p>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="controls-wrapper">
                <div class="player-btns">
                    <button class="skip-btn" id="rewind"><i class="fas fa-undo"></i></button>
                    <div class="nav-btn" id="prev"><i class="fas fa-step-backward"></i></div>
                    <div class="play-btn" id="play-pause"><i class="fas fa-play" id="play-icon"></i></div>
                    <div class="nav-btn" id="next"><i class="fas fa-step-forward"></i></div>
                    <button class="skip-btn" id="forward"><i class="fas fa-redo"></i></button>
                </div>
                <div style="display:flex; align-items:center; gap:10px; opacity:0.6">
                    <i class="fas fa-volume-down"></i>
                    <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.1">
                    <i class="fas fa-volume-up"></i>
                </div>
            </div>
            <audio id="main-audio"></audio>
        </div>

        <div class="glass-panel" id="profile-card">
            <div class="panel-label">About Me</div>
            <div class="avatar-container" onclick="launchOsu()">
                <img src="face.png" class="profile-avatar">
            </div>
            <h2 style="margin:0; letter-spacing: 1px;">chakaezba</h2>
            <div class="social-icons">
                <a href="https://t.me/chakaezba" target="_blank"><i class="fab fa-telegram"></i></a>
                <a href="https://steamcommunity.com/id/chakaezba/" target="_blank"><i class="fab fa-steam"></i></a>
                <a href="https://open.spotify.com/playlist/3ZJFssXSUtbDXGORMc7eQU?si=b-OQhdTOS4C7B7sXx6YCdQ" target="_blank"><i class="fab fa-spotify"></i></a>
            </div>
        </div>

        <div class="glass-panel" id="track-card">
            <div class="panel-label">Tracklist</div>
            <div id="list"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-pause');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const volumeSlider = document.getElementById('volume');
        const list = document.getElementById('list');
        const cover = document.getElementById('cover');
        const title = document.getElementById('title');
        const artistText = document.getElementById('artist');
        const playerCard = document.getElementById('player-card');
        
        let currentIdx = -1;
        let isPlayerVisible = false;

        function b64toBlob(b64) {
            const bin = atob(b64);
            const array = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) array[i] = bin.charCodeAt(i);
            return URL.createObjectURL(new Blob([array], {type: 'audio/mpeg'}));
        }

        function closePlayer() {
            playerCard.classList.remove('visible');
            isPlayerVisible = false;
            pauseTrack();
            const items = document.querySelectorAll('.track-mini-item');
            items.forEach(i => i.classList.remove('active'));
            currentIdx = -1;
        }

        function loadTrack(index, playImmediate = false) {
            if (index < 0 || index >= myTracks.length) return;
            
            if (isPlayerVisible && currentIdx === index && playImmediate) {
                closePlayer();
                return;
            }

            if (playImmediate) {
                playerCard.classList.add('visible');
                isPlayerVisible = true;
            }

            currentIdx = index;
            const t = myTracks[index];

            const items = document.querySelectorAll('.track-mini-item');
            items.forEach(i => i.classList.remove('active'));
            if(items[index]) items[index].classList.add('active');

            cover.src = t.cover ? `data:image/png;base64,${t.cover}` : 'https://via.placeholder.com/340';
            title.innerText = t.title;
            artistText.innerText = t.artist || "Unknown Artist";
            
            audio.src = b64toBlob(t.audio);
            audio.volume = volumeSlider.value;

            if (playImmediate) playTrack();
        }

        function playTrack() { audio.play(); playIcon.classList.replace('fa-play', 'fa-pause'); }
        function pauseTrack() { audio.pause(); playIcon.classList.replace('fa-pause', 'fa-play'); }

        function launchOsu() {
            if (confirm("Открыть osu! на этом ПК?")) {
                window.location.href = "osu://";
            }
        }

        playBtn.addEventListener('click', () => audio.paused ? playTrack() : pauseTrack());
        
        document.getElementById('rewind').onclick = () => { audio.currentTime -= 10; };
        document.getElementById('forward').onclick = () => { audio.currentTime += 10; };
        
        volumeSlider.addEventListener('input', (e) => audio.volume = e.target.value);
        
        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        audio.addEventListener('ended', () => {
            let next = currentIdx + 1;
            if (next >= myTracks.length) next = 0;
            loadTrack(next, true);
        });

        document.getElementById('prev').onclick = () => {
            let prev = currentIdx - 1;
            if (prev < 0) prev = myTracks.length - 1;
            loadTrack(prev, true);
        };

        document.getElementById('next').onclick = () => {
            let next = currentIdx + 1;
            if (next >= myTracks.length) next = 0;
            loadTrack(next, true);
        };

        window.onload = () => {
            audio.volume = 0.1;
            if (typeof myTracks !== 'undefined' && myTracks.length > 0) {
                myTracks.forEach((t, i) => {
                    const div = document.createElement('div');
                    div.className = 'track-mini-item';
                    div.innerHTML = `<img src="${t.cover ? 'data:image/png;base64,' + t.cover : 'https://via.placeholder.com/80'}">`;
                    div.onclick = () => loadTrack(i, true);
                    list.appendChild(div);
                });
                const first = myTracks[0];
                cover.src = first.cover ? `data:image/png;base64,${first.cover}` : 'https://via.placeholder.com/340';
                title.innerText = first.title;
                artistText.innerText = first.artist || "Unknown Artist";
            }
        };
    </script>
</body>
</html>
