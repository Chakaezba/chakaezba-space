<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chakaezba Space</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --glass: rgba(255, 255, 255, 0.05); 
            --glass-hover: rgba(255, 255, 255, 0.08);
            --blur: blur(25px); 
            --accent: #ffffff; 
            --accent-glow: rgba(255, 255, 255, 0.4);
            --border: rgba(255, 255, 255, 0.1);
        }
        
        /* Живой фон */
        body { 
            margin: 0; 
            min-height: 100vh; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(-45deg, #0f0c29, #1c1642, #24243e, #14112e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            overflow: hidden; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .main-layout { display: flex; align-items: center; justify-content: center; gap: 24px; height: 620px; width: 95%; max-width: 1200px; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        
        /* Улучшенные стеклянные панели */
        .glass-panel { 
            background: var(--glass); 
            backdrop-filter: var(--blur); 
            -webkit-backdrop-filter: var(--blur); 
            border: 1px solid var(--border); 
            border-radius: 32px; 
            padding: 40px 25px 25px 25px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.3); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box; 
            position: relative; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        .glass-panel:hover {
            background: var(--glass-hover);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            transform: translateY(-2px);
        }

        .panel-label { position: absolute; top: 15px; left: 20px; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.3; font-weight: 700; pointer-events: none; transition: 0.3s; }
        .glass-panel:hover .panel-label { opacity: 0.6; }

        /* Упругий выезд плеера */
        #player-card { width: 380px; height: 100%; opacity: 0; visibility: hidden; transform: translateX(60px) scale(0.95); margin-right: -404px; pointer-events: none; transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), margin 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        #player-card.visible { opacity: 1; visibility: visible; transform: translateX(0) scale(1); margin-right: 0; pointer-events: auto; }

        #profile-card { width: 280px; height: 100%; justify-content: center; z-index: 2; }
        #track-card { width: 130px; height: 100%; overflow-y: auto; z-index: 2; }

        /* Анимация аватарки */
        .avatar-container { width: 150px; height: 150px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.15); overflow: hidden; margin-bottom: 20px; position: relative; flex-shrink: 0; cursor: pointer; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .avatar-container:hover { transform: scale(1.05) rotate(3deg); border-color: rgba(255,255,255,0.4); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .profile-avatar { width: 100%; height: 100%; object-fit: cover; }
        
        .social-icons { display: flex; gap: 18px; margin-top: 30px; }
        .social-icons a { color: white; font-size: 22px; opacity: 0.5; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); text-decoration: none; }
        .social-icons a:hover { opacity: 1; transform: translateY(-4px) scale(1.1); text-shadow: 0 0 15px rgba(255,255,255,0.5); }

        /* Стиль счетчика посещений */
        .visits-counter { 
            margin-top: 25px; 
            font-size: 10px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            opacity: 0.25; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: opacity 0.3s, transform 0.3s;
        }
        .glass-panel:hover .visits-counter { opacity: 0.6; transform: scale(1.02); }

        /* Плавная обложка */
        .main-cover { width: 100%; aspect-ratio: 1/1; border-radius: 20px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 20px; transition: opacity 0.2s ease, transform 0.2s ease; }
        .main-cover.changing { opacity: 0; transform: scale(0.92); }
        
        .info { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 15px; text-align: center; }
        .info h2 { margin: 0; font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .info p { margin: 5px 0 0 0; font-size: 13px; color: rgba(255,255,255,0.4); font-weight: 500; }
        
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 10px; cursor: pointer; margin-bottom: 25px; transition: height 0.2s; }
        .progress-container:hover { height: 8px; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; border-radius: 10px; box-shadow: 0 0 10px var(--accent-glow); transition: width 0.1s linear; }
        
        /* Упругие кнопки */
        .controls-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 20px; }
        .player-btns { display: flex; justify-content: center; align-items: center; gap: 18px; }
        
        .nav-btn { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); font-size: 14px; border: 1px solid rgba(255,255,255,0.02); }
        .nav-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.1); transform: scale(1.15); }
        .nav-btn:active { transform: scale(0.95); }
        
        .skip-btn { background: none; border: none; color: white; opacity: 0.3; cursor: pointer; transition: all 0.3s; font-size: 15px; padding: 10px; }
        .skip-btn:hover { opacity: 0.8; transform: scale(1.15); }
        
        .play-btn { width: 64px; height: 64px; background: white; color: black; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .play-btn:hover { transform: scale(1.1); box-shadow: 0 10px 25px rgba(255,255,255,0.3); }
        .play-btn:active { transform: scale(0.9); }
        
        .volume-container { display: flex; align-items: center; gap: 10px; opacity: 0.4; transition: 0.3s; }
        .volume-container:hover { opacity: 1; }
        .volume-slider { -webkit-appearance: none; width: 90px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 5px; outline: none; transition: 0.3s; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: white; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .volume-slider:hover::-webkit-slider-thumb { transform: scale(1.3); }

        /* Эффект каскадного появления */
        .track-mini-item { width: 80px; height: 80px; margin-bottom: 15px; cursor: pointer; flex-shrink: 0; opacity: 0; transform: translateY(15px); animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        
        .track-mini-item img { width: 100%; height: 100%; border-radius: 20px; object-fit: cover; opacity: 0.3; border: 2px solid transparent; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .track-mini-item:hover img { opacity: 0.7; transform: scale(1.05); }
        .track-mini-item.active img { opacity: 1; border-color: var(--accent); transform: scale(1.1); box-shadow: 0 5px 15px var(--accent-glow); }

        ::-webkit-scrollbar { width: 0px; }

        @media (max-width: 900px) {
            body { overflow-y: auto; align-items: flex-start; padding: 25px 0; }
            .main-layout { flex-direction: column; height: auto; gap: 15px; }
            
            #profile-card { width: 92%; height: auto; order: 1; padding: 50px 25px; }
            
            #track-card { width: 92%; height: auto; order: 2; overflow-y: visible; padding: 30px 15px 15px 15px; }
            
            #list { display: flex; overflow-x: auto; width: 100%; gap: 15px; padding: 10px 0; scrollbar-width: none; }

            #player-card { width: 92%; margin-right: 0; height: auto; order: 3; }
            
            .track-mini-item { margin-bottom: 0; }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="glass-panel" id="player-card">
            <div class="panel-label">Music Player</div>
            <img id="cover" src="" class="main-cover">
            <div class="info">
                <h2 id="title">Loading...</h2>
                <p id="artist">Artist</p>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="controls-wrapper">
                <div class="player-btns">
                    <button class="skip-btn" id="rewind"><i class="fas fa-undo"></i></button>
                    <div class="nav-btn" id="prev"><i class="fas fa-step-backward"></i></div>
                    <div class="play-btn" id="play-pause"><i class="fas fa-play" id="play-icon"></i></div>
                    <div class="nav-btn" id="next"><i class="fas fa-step-forward"></i></div>
                    <button class="skip-btn" id="forward"><i class="fas fa-redo"></i></button>
                </div>
                <div class="volume-container">
                    <i class="fas fa-volume-down" style="font-size: 13px;"></i>
                    <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.1">
                    <i class="fas fa-volume-up" style="font-size: 13px;"></i>
                </div>
            </div>
            <audio id="main-audio"></audio>
        </div>

        <div class="glass-panel" id="profile-card">
            <div class="panel-label">About Me</div>
            <div class="avatar-container" onclick="launchOsu()">
                <img src="avatar.png" class="profile-avatar">
            </div>
            <h2 style="margin:0; letter-spacing: 1px;">chakaezba</h2>
            <div class="social-icons">
                <a href="https://t.me/chakaezba" target="_blank"><i class="fab fa-telegram"></i></a>
                <a href="https://steamcommunity.com/id/chakaezba/" target="_blank"><i class="fab fa-steam"></i></a>
                <a href="https://open.spotify.com/playlist/3ZJFssXSUtbDXGORMc7eQU?si=b-OQhdTOS4C7B7sXx6YCdQ" target="_blank"><i class="fab fa-spotify"></i></a>
            </div>
            <div class="visits-counter">
                <i class="fas fa-eye" style="font-size: 11px;"></i> Views: <span id="visit-count">...</span>
            </div>
        </div>

        <div class="glass-panel" id="track-card">
            <div class="panel-label">Tracklist</div>
            <div id="list"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-pause');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const volumeSlider = document.getElementById('volume');
        const list = document.getElementById('list');
        const cover = document.getElementById('cover');
        const title = document.getElementById('title');
        const artistText = document.getElementById('artist');
        const playerCard = document.getElementById('player-card');
        
        let currentIdx = -1;
        let isPlayerVisible = false;
        let fadeInterval = null;
        let originalTitle = document.title;

        function b64toBlob(b64) {
            const bin = atob(b64);
            const array = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) array[i] = bin.charCodeAt(i);
            return URL.createObjectURL(new Blob([array], {type: 'audio/mpeg'}));
        }

        function fadeVolume(target, duration, callback) {
            if (fadeInterval) clearInterval(fadeInterval);
            const step = (target - audio.volume) / (duration / 50);
            fadeInterval = setInterval(() => {
                let nextVol = audio.volume + step;
                if ((step > 0 && nextVol >= target) || (step < 0 && nextVol <= target)) {
                    audio.volume = target;
                    clearInterval(fadeInterval);
                    if (callback) callback();
                } else {
                    audio.volume = nextVol;
                }
            }, 50);
        }

        function closePlayer() {
            fadeVolume(0, 300, () => {
                playerCard.classList.remove('visible');
                isPlayerVisible = false;
                pauseTrack();
                document.title = originalTitle;
                const items = document.querySelectorAll('.track-mini-item');
                items.forEach(i => i.classList.remove('active'));
                currentIdx = -1;
            });
        }

        function loadTrack(index, playImmediate = false) {
            if (index < 0 || index >= myTracks.length) return;
            if (isPlayerVisible && currentIdx === index && playImmediate) {
                closePlayer();
                return;
            }
            if (isPlayerVisible && playImmediate) {
                fadeVolume(0, 200, () => switchData(index, true));
            } else {
                switchData(index, playImmediate);
            }
        }

        function switchData(index, playImmediate) {
            if (playImmediate) {
                playerCard.classList.add('visible');
                isPlayerVisible = true;
            }
            currentIdx = index;
            const t = myTracks[index];
            const items = document.querySelectorAll('.track-mini-item');
            items.forEach(i => i.classList.remove('active'));
            if(items[index]) items[index].classList.add('active');

            document.title = `🎵 ${(t.artist || "Unknown")} - ${t.title}`;

            cover.classList.add('changing');
            
            setTimeout(() => {
                cover.src = t.cover ? `data:image/png;base64,${t.cover}` : 'https://via.placeholder.com/340';
                title.innerText = t.title;
                artistText.innerText = t.artist || "Unknown Artist";
                audio.src = b64toBlob(t.audio);
                
                cover.classList.remove('changing');
                
                if (playImmediate) {
                    audio.volume = 0;
                    playTrack();
                    fadeVolume(volumeSlider.value, 400);
                } else {
                    audio.volume = volumeSlider.value;
                }
            }, 200);
        }

        function playTrack() { audio.play(); playIcon.classList.replace('fa-play', 'fa-pause'); }
        function pauseTrack() { audio.pause(); playIcon.classList.replace('fa-pause', 'fa-play'); }

        function launchOsu() {
            if (confirm("Открыть osu! на этом ПК?")) {
                window.location.href = "osu://";
            }
        }

        // Функция запроса к бесплатному API счетчика посещений
        function countVisits() {
            fetch('https://api.counterapi.dev/v1/chakaezba/space/up')
                .then(res => res.json())
                .then(data => {
                    if (data && data.count) {
                        document.getElementById('visit-count').innerText = data.count;
                    }
                })
                .catch(err => {
                    console.log('Ошибка счетчика:', err);
                    document.getElementById('visit-count').innerText = 'offline';
                });
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.volume = 0;
                playTrack();
                fadeVolume(volumeSlider.value, 400);
            } else {
                fadeVolume(0, 400, () => pauseTrack());
            }
        });
        
        document.getElementById('rewind').onclick = () => { audio.currentTime -= 10; };
        document.getElementById('forward').onclick = () => { audio.currentTime += 10; };
        volumeSlider.addEventListener('input', (e) => {
            if (!fadeInterval || !fadeInterval._idleTimeout) audio.volume = e.target.value;
        });
        
        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        audio.addEventListener('ended', () => {
            let next = currentIdx + 1;
            if (next >= myTracks.length) next = 0;
            loadTrack(next, true);
        });

        document.getElementById('prev').onclick = () => {
            let prev = currentIdx - 1;
            if (prev < 0) prev = myTracks.length - 1;
            loadTrack(prev, true);
        };

        document.getElementById('next').onclick = () => {
            let next = currentIdx + 1;
            if (next >= myTracks.length) next = 0;
            loadTrack(next, true);
        };

        window.onload = () => {
            audio.volume = 0.1;
            countVisits(); // Запускаем подсчет просмотров при загрузке страницы
            
            if (typeof myTracks !== 'undefined' && myTracks.length > 0) {
                myTracks.forEach((t, i) => {
                    const div = document.createElement('div');
                    div.className = 'track-mini-item';
                    div.style.animationDelay = `${i * 0.1}s`;
                    div.innerHTML = `<img src="${t.cover ? 'data:image/png;base64,' + t.cover : 'https://via.placeholder.com/80'}">`;
                    div.onclick = () => loadTrack(i, true);
                    list.appendChild(div);
                });
                const first = myTracks[0];
                cover.src = first.cover ? `data:image/png;base64,${first.cover}` : 'https://via.placeholder.com/340';
                title.innerText = first.title;
                artistText.innerText = first.artist || "Unknown Artist";
            }
        };
    </script>
</body>
</html>
